# NagaHana.
# Dependency groups follow the approved stack (D-09, D-55). The core needs NumPy, pandas, PyTorch and
# PyYAML; everything else is an optional extra, so each host installs only what it uses.
# Version pins are set at the first environment lock (docs/adr/0001).

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "nagahana"
version = "0.0.1"
description = "NagaHana: Adversary Foundation Model for Simulation-based Threat Forecasting (research codebase)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy", "pandas", "torch", "pyyaml"]

[project.optional-dependencies]
graph = ["torch-geometric"]                                   # PyG (incl. TGN, HypergraphConv, HeteroData)
rl = ["torchrl", "tensordict", "LightZero"]                   # policy/value agents, MCTS/MuZero family
metrics = ["torchmetrics"]
baselines = ["scikit-learn", "xgboost", "lightgbm", "catboost"]   # published-baseline reproductions (D-55)
config = ["hydra-core", "omegaconf"]
track = ["mlflow", "dvc"]
scale = ["accelerate", "deepspeed"]                           # DeepSpeed: Linux/CUDA hosts
jax = ["jax", "equinox", "flax", "diffrax", "optimistix", "jaxtyping", "blackjax", "numpyro"]
prob = ["pyro-ppl"]
data = ["pandas", "polars", "pyarrow", "duckdb", "scipy", "statsmodels"]
pcap = ["dpkt", "scapy", "pyshark"]                       # dpkt: the PCAP adapter (ingest/pcap.py)
ui = ["streamlit"]                                            # demo interface choice is held (D-28)
perf = ["triton", "flash-attn"]                               # Linux/CUDA hosts
docs = ["mkdocs", "mkdocs-material", "pymdown-extensions"]
dev = ["pytest", "hypothesis", "ruff", "mypy"]
# Kafka client is held (D-27): confluent-kafka | aiokafka | kafka-python.

[project.scripts]
nagahana = "nagahana.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/nagahana"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "slow: long-running test, run in the nightly CI job",
    "gpu: needs a CUDA device; deselected on CPU-only hosts",
]

[tool.ruff]
line-length = 130
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]          # long docstring lines carry equations and quotes

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["nagahana"]
ignore_missing_imports = true
warn_unused_ignores = true
