# NagaHana research codebase.
# Dependency groups follow the approved stack (decision D-09, 2026-09-29: "all the tech stack yours
# and mine together"). The core needs only NumPy + PyTorch (+ PyYAML for configs); everything else is
# an optional extra so a laptop, the Fedora workstation and a GPU server can each install what they use.
# Version pins are deliberately absent until the first environment lock (see docs/adr/0001).

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "nagahana"
version = "0.0.1"
description = "NagaHana: Adversary Foundation Model for Simulation-based Threat Forecasting (research codebase)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy", "torch", "pyyaml"]

[project.optional-dependencies]
graph = ["torch-geometric"]                                   # PyG (incl. TGN, HypergraphConv, HeteroData)
rl = ["torchrl", "tensordict", "LightZero"]                   # policy/value agents, MCTS/MuZero family
metrics = ["torchmetrics"]
config = ["hydra-core", "omegaconf"]
track = ["mlflow", "dvc"]
scale = ["accelerate", "deepspeed"]                           # DeepSpeed: Linux/CUDA hosts
jax = ["jax", "equinox", "flax", "diffrax", "optimistix", "jaxtyping", "blackjax", "numpyro"]
prob = ["pyro-ppl"]
data = ["pandas", "polars", "pyarrow", "duckdb", "scipy", "statsmodels"]
pcap = ["scapy", "pyshark"]
ui = ["streamlit"]                                            # demo interface choice is held (D-28)
perf = ["triton", "flash-attn"]                               # Linux/CUDA hosts
docs = ["mkdocs", "mkdocs-material", "pymdown-extensions"]
dev = ["pytest", "hypothesis", "ruff", "mypy"]
# Kafka client is held (D-27): confluent-kafka | aiokafka | kafka-python.

[project.scripts]
nagahana = "nagahana.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/nagahana"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 130
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]          # long docstring lines carry equations and quotes

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["nagahana"]
ignore_missing_imports = true
warn_unused_ignores = true
