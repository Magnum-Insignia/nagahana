  lr: 0.0003
  # [AS-406] AdamW weight decay on matrices
  weight_decay: 0.1
  # [AS-406] linear warm-up steps
  warmup_steps: 2000
  # [AS-406] global gradient-norm clip
  grad_clip: 1.0
  # [AS-39] matrix compute precision with fp32 master weights
  precision: bf16
  # [AS-326] train / test / validation shares of full training
  splits_full: [0.6, 0.2, 0.2]
  # [AS-326] train / validation shares of pretraining
  splits_pretrain: [0.7, 0.3]
  # [AS-26] rank of the site calibration adapters
  lora_rank: 16
