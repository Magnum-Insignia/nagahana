  heads: 16
  # [AS-32] SwiGLU hidden width
  mlp_hidden: 2816
  # [AS-20] ATT&CK technique action slots
  n_techniques: 700
  # [build-spec section 2.8] top entities by compromise in the context (plus the adversary slots)
