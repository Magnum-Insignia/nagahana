# NagaHana root configuration (Hydra composition format; readable with PyYAML too).
#
# Convention: `???` = undecided. Either a held design decision (see
# src/nagahana/governance/decisions.py) or a hyperparameter nobody has chosen yet.
# Reading a `???` key raises; nothing is defaulted [Q-39].
# List what is still undecided:  python -m nagahana check-config conf/<file>.yaml

defaults:
  - datamodel: v0
  - physics: boundary
  - memory: regions
  - model/cvgae: cvgae
  - model/tstct: tstct
  - model/decoder: decoder
  - model/taaft: taaft
  - model/heads: heads
  - model/generator: generator
  - tracking: mlflow
  - runtime: accelerate
  - _self_

run:
  mode: ???                 # train | evaluate | infer_live | forensic_replay | lab (no default mode)
  seed: ???
  site: ???                 # deployment site id (Kafka topics, calibration adapters)

# Proposals (P-xx) enabled for this run. Proposal code runs only when listed here.
# Empty by default: proposals are engineering suggestions awaiting the owner's approval.
enabled_proposals: []
