# NagaHana root configuration (Hydra composition format; readable with PyYAML too).
# Generated from the typed dataclasses by nagahana.core.config.generate_conf (D-57). Do not edit by hand:
# change the dataclass default and regenerate; tests compare this file with the code.
# The run settings below have no default: ??? marks them as required (reading one raises).
defaults:
  - decisions: decisions
  - site: site
  - model/inputs: inputs
  - model/graph: graph
  - model/cvgae: cvgae
  - model/decoder: decoder
  - model/tstct: tstct
  - model/memory: memory
  - model/taaft: taaft
  - model/forecaster: forecaster
  - model/advisor: advisor
  - model/verifier: verifier
  - model/generator: generator
  - model/training: training
  - _self_
run:
  # [core/modes.py] train | evaluate | infer_live | forensic_replay | lab (no default mode)
  mode: ???
  # [run setting] seed of every random draw of the run (route sampling, masking, splits)
  seed: ???
  # [run setting] deployment site id (topics, calibration adapters)
  site: ???
  # [governance/decisions.py] proposals (P-xx) whose code may run in this run; empty by default
  enabled_proposals: []
