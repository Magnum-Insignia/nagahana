# Evaluation settings (src/nagahana/evaluation/config.py, docs/evaluation.md).
# Generated from the EvaluationConfig dataclasses: python -m nagahana evaluate config --write
# conf/evaluation/evaluation.yaml. Edit the dataclasses, then regenerate; a test checks that this file
# equals the generated text. Every value is set; assumptions are documented in
# docs/assumptions/evaluation.md.
seed: 0
resampling:
  n_resamples: 2000
  confidence: 0.95
  interval: bca
  jackknife_groups: 100
  chunk_elements: 20000000
  mean_block_length: null
  heavy_resamples: 200
schemes:
  detection: stationary
  forecast: stationary
  state_forecast: stationary
  stage: stationary
  time_to_event: stationary
  paths: cluster
  timeliness: cluster
  forensics: cluster
  components: iid
  explanations: stationary
operating_point:
  alpha: 0.001
  detection: own
  timeliness_own: own
  missing_own: conformal
  calibration_split: val
  conformal_scope: dataset
detection:
  partial_auroc_max_fpr: 0.01
  fixed_fprs:
  - 0.001
  - 0.01
  deployment_base_rates:
  - 0.001
  - 0.01
forecast:
  horizons:
  - '1'
  - mid
  - K
  ece_bins: 10
  ece_strategy: width
  log_score_eps: null
  climatology_scope: dataset
  fair_crps: true
  reliability_bins: 10
  temperatures:
  - 0.5
  - 0.75
  - 1.0
  - 1.5
  - 2.0
timeliness:
  late_horizons: 1.0
  match_entity: true
  window_start: horizon
  quantiles:
  - 0.1
  - 0.25
  - 0.75
  - 0.9
survival:
  tied_times: exclude
  interpolation: step
  marker: survival
  dcal_bins: 10
stages:
  top_k:
  - 1
  - 3
  classes: union
  ece_bins: 10
  ace_ranges: 15
paths:
  top_n: 5
  tolerance: 0.25
  entity_rule: exact
  include_empty: false
comparisons:
  fdr_method: bh
  fdr_level: 0.05
  mcnemar_mid_p: true
  dm_lags: null
  wilcoxon_zero_method: wilcox
  permutations: 10000
models:
  primary: nagahana
  lr_family:
  - logistic_regression
  display:
    nagahana: \NagaHana{}
    logistic_regression: LR
    persistence: Persistence
    climatology: Climatology
    cyberworld: CyberWorld (RSSM)
    flowtransformer: FlowTransformer
forensics:
  top_k: 3
  tolerance_windows: 1.0
  entity_rule: exact
operations:
  batches: 20
arena:
  min_seeds: 3
  profile_points: 50
  control: control
protocols:
  p1_split: zero_shot
  p1_novelty: families_and_networks
  p2_test_splits:
  - test
  - zero_shot
  p3_site_benign_hours: 24.0
  p3_site_analyst_alerts: 50
  p4_reference_regime: full
  p4_regimes:
  - full
  - flow_packet
  - flow_only
  - sampled
  - encrypted
  - untapped
  p4_dataset: cse-cic-ids2018
  p4_novelty: known
  p5_corruptions:
  - skew
  - reorder
  - drop
  - dup
  - spoof
  - flood
  p5_share: 0.1
  p6_enabled_proposals: []
  p6_miller_madow: true
  p8_telemetry:
  - full
  - flow_only
