ablations:
- id: INF-R1
  tier: inference
  component: TSTCT and TAAFT loops
  removal: one thinking pass (R = 1)
  thesis_id: ''
- id: INF-D0
  tier: inference
  component: TAAFT energy refinement
  removal: no descent steps
  thesis_id: A8
- id: INF-ENV
  tier: inference
  component: Environment memory
  removal: TSTCT reads only the current window
  thesis_id: ''
- id: INF-LTM
  tier: inference
  component: Long-term memory
  removal: long-term memory not read
  thesis_id: ''
- id: INF-PHYS
  tier: inference
  component: Physics boundary
  removal: Phi_phys term and hard limits off at inference
  thesis_id: ''
- id: INF-N1
  tier: inference
  component: Forecaster routes
  removal: one imagined route (N = 1)
  thesis_id: ''
- id: SS-LENS-BELIEF_TRUST
  tier: single_stage
  component: TAAFT lens
  removal: belief_trust term removed from E_total
  thesis_id: ''
- id: SS-LENS-GAME
  tier: single_stage
  component: TAAFT lens
  removal: game term removed from E_total
  thesis_id: ''
- id: SS-LENS-INFORMATION
  tier: single_stage
  component: TAAFT lens
  removal: information term removed from E_total
  thesis_id: ''
- id: SS-LENS-TOPOLOGY
  tier: single_stage
  component: TAAFT lens
  removal: topology term removed from E_total
  thesis_id: ''
- id: SS-LENS-TIME
  tier: single_stage
  component: TAAFT lens
  removal: time term removed from E_total
  thesis_id: ''
- id: SS-LENS-CAUSE
  tier: single_stage
  component: TAAFT lens
  removal: cause term removed from E_total
  thesis_id: ''
- id: SS-CAUSAL
  tier: single_stage
  component: TSTCT causal heads
  removal: causal heads off
  thesis_id: ''
- id: SS-GEN
  tier: single_stage
  component: Generator
  removal: no Generator variants in training
  thesis_id: A10
- id: SS-NOPRE
  tier: single_stage
  component: TAAFT pretraining
  removal: Stage 2 TAAFT pretraining skipped
  thesis_id: ''
- id: SS-REWARD
  tier: single_stage
  component: Process rewards
  removal: outcome-only rewards
  thesis_id: A11
- id: SS-COUPLING
  tier: single_stage
  component: TAAFT and heads coupling
  removal: joint or separate instead of staged
  thesis_id: A12
- id: FR-PLANES1
  tier: full
  component: CVG-AE planes
  removal: one plane instead of six
  thesis_id: ''
- id: FR-NOTEMP
  tier: full
  component: TSTCT temporal heads
  removal: no temporal heads
  thesis_id: ''
- id: FR-PAIRWISE
  tier: full
  component: Hypergraph
  removal: pairwise graph instead of hyperedges
  thesis_id: A1
- id: FR-COUPLING0
  tier: full
  component: Cross-plane coupling
  removal: coupling omega_pq = 0
  thesis_id: A2
- id: FR-DETERMINISTIC
  tier: full
  component: Variational latent
  removal: deterministic encoder
  thesis_id: A3
- id: FR-CONTINUOUS
  tier: full
  component: Categorical latent factors
  removal: continuous-only latent
  thesis_id: A4
- id: FR-NOPHYSICS
  tier: full
  component: Physics boundary
  removal: no physics term and no hard limits in training
  thesis_id: A5
- id: FR-ZEROFILL
  tier: full
  component: Observation status
  removal: zero-filling instead of status
  thesis_id: A6
- id: FR-NOCAUSALTOPO
  tier: full
  component: Causal heads and topology bias
  removal: both removed
  thesis_id: A7
- id: FR-FULLOBS
  tier: full
  component: Partial observability
  removal: full observability assumed
  thesis_id: A9
- id: FR-STATIC
  tier: full
  component: Dynamics
  removal: static head on the same encoder
  thesis_id: A13
