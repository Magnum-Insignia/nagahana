      # [detail] AdamW kernel: auto | foreach | fused | loop
      adamw_implementation: auto
      # [D-61] Muon momentum mu
      muon_momentum: 0.95
      # [D-61] Nesterov momentum in Muon
      muon_nesterov: true
      # [D-61] Newton-Schulz iterations of Muon
      muon_ns_steps: 5
      # [D-61] Muon lr adjustment: match_rms_adamw (0.2 sqrt(max(A, B))) | original
      muon_adjust: match_rms_adamw
      # [D-61, AS-39] precision of the Newton-Schulz iteration: bf16 (as torch.optim.Muon) | fp32
      muon_ns_dtype: bf16
      # [D-61, AS-581] QK-Clip after every optimiser step (MuonClip, arXiv:2507.20534)
      qk_clip: true
      # [AS-581] largest admissible pre-softmax attention logit per head
      qk_clip_tau: 100.0
      # [AS-406] global gradient-norm clip, once per optimiser step after the reduction
      grad_clip: 1.0
      # [D-61, AS-570] learning-rate schedule: wsd (default) | cosine | linear | constant
      schedule: wsd
      # [AS-406, AS-570] linear warm-up steps
      warmup_steps: 100
      # [AS-570] WSD: share of the planned steps spent decaying (Haegele et al.: 20 %)
      decay_fraction: 0.2
      # [AS-570] WSD decay shape: 1-sqrt (Haegele et al.) | linear | cosine
      decay_shape: 1-sqrt
      # [AS-570] final learning rate as a share of the peak
      min_lr_ratio: 0.0
      # [AS-406, AS-572] consecutive non-finite steps tolerated before raising (0 = refuse the first)
      max_nonfinite_skips: 0
    # [AS-573] weight averaging
    ema:
      # [AS-573] keep an EMA of the trained weights
      enabled: false
      # [AS-573] EMA decay
      decay: 0.9999
      # [AS-573] decay_t = min(decay, (1 + t) / (10 + t))
      warmup: true
      # [AS-573] validate (and export) with the averaged weights
      evaluate_with_ema: true
    # [AS-574] early stopping
    early_stop:
      # [AS-574] stop when the monitored metric stops improving
      enabled: true
      # [AS-574] validation metric watched (a 'val/...' key of the evaluation)
      monitor: val/total
      # [AS-574] min or max
      mode: min
      # [AS-574] evaluations without improvement before stopping
      patience: 10
      # [AS-574] smallest change counted as an improvement
      min_delta: 0.0
      # [AS-574] the stage ends with its best validated weights
      restore_best: true
    # [AS-576] resumable checkpoints
    checkpoint:
      # [AS-576] optimiser steps between resumable checkpoints
      every_steps: 1000
      # [AS-576] newest checkpoints kept per stage (the best weights are kept apart)
      keep_last: 3
# [P-17] ablation switches (full = the design)
ablation:
  # [P-17] name of the ablation variant (training.ablation.build_variants); full = no ablation
  variant: full
  # [P-17, AS-579] none (the design) | inference | single-stage | full
  tier: none
  # [D-42, P-17] TAAFT lens terms removed from E_total (names of TAAFTConfig.lenses)
  lenses_off: []
  # [AS-09, AS-10] TSTCT causal heads contribute (False: their outputs are masked)
  tstct_causal_heads: true
  # [AS-09] TSTCT temporal heads contribute (False: their outputs are masked)
  tstct_temporal_heads: true
  # [D-43, D-44, AS-07] fixed loop passes R for TSTCT and TAAFT (None = the design: sampled in training, run-time budget at inference)
  loop_passes: null
  # [D-51] carry the Environment across windows (False: every window starts empty)
  environment: true
  # [AS-11, AS-220] TAAFT reads the long-term memory
  longterm_memory: true
  # [D-18, D-37] the physics boundary (stage-1 term and TAAFT's physics lens)
  physics: true
  # [D-23, D-40] Generator augmentation of the training split
  generator: true
  # [D-22] run TAAFT pretraining (False: stage 3 starts TAAFT from its initialisation)
  stage2_pretraining: true
  # [D-39, AS-01] CVG-AE relation planes removed (names of GraphConfig.planes)
  planes_off: []
